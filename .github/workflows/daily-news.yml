name: Daily auto news

on:
  schedule:
    # 00:00 UTC = 07:00 giờ Việt Nam, mỗi ngày
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử, không commit"
        type: boolean
        default: false

concurrency:
  group: daily-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sinh bài mới
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/generate-daily-post.mjs

      - name: Commit & push
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet; then
            echo "Không có thay đổi — bỏ qua."
            exit 0
          fi
          git config user.name "flora-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/data/wp-content.json src/lib/i18n/content/news-cache.json scripts/data/auto-post-log.json
          git commit -m "content: bài tự động — ${{ steps.gen.outputs.title }}"
          git push
